[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmdaudit"
version = "0.1.0"
description = "统计 AI coding agent 会话里每条命令的耗时、退出码与失败原因"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

# 依赖上限 4 个，见 docs/plan.md §0 硬约束。加第 5 个需在 PR 里说明理由。
dependencies = [
  "tree-sitter==0.26.0",
  "tree-sitter-bash==0.25.1",
  "drain3==0.9.11",
  "duckdb==1.1.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.9.2", "mypy==1.14.1"]

[project.scripts]
cmdaudit = "cmdaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# 工作台外壳是预编译产物（web/ 子工程 → dist/index.html），必须随包分发：
# 终端用户装 cmdaudit 不需要 Node 工具链。
[tool.setuptools.package-data]
cmdaudit = ["viz/shell.html"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 注释与文档一律中文，全角标点是有意的。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
files = ["src/cmdaudit"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["drain3.*", "duckdb", "tree_sitter_bash"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# 不依赖 editable 安装：macOS 上 pip 生成的 __editable__*.pth 可能被打上 UF_HIDDEN，
# 被 site.addpackage 静默跳过，于是 venv 里 import cmdaudit 失败。测试直接指向源码树。
pythonpath = ["src"]
